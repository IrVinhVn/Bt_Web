services:
  web:
    image: nginx:alpine
    container_name: nginx_btweb
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html
    restart: unless-stopped

  nodered:
    image: nodered/node-red:latest
    container_name: nodered_btweb
    ports:
      - "1880:1880"
    volumes:
      - ./nodered_data:/data
    restart: unless-stopped

  mariadb:
    image: mariadb:10.11
    container_name: mariadb_btweb
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: web_db
      MYSQL_USER: vinh
      MYSQL_PASSWORD: 123456
    ports:
      - "3306:3306"
    volumes:
      - ./db_data:/var/lib/mysql
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_btweb
    environment:
      PMA_HOST: mariadb
    ports:
      - "8081:80"
    depends_on:
      - mariadb
    restart: unless-stopped
